
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrgHub | Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .login-container h1 {
            margin: 0 0 8px;
            color: #183153;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 28px;
            color: #777;
            text-align: center;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #183153;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #login-message {
            margin-top: 16px;
            font-size: 14px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            color: #183153;
            text-align: center;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h1>OrgHub</h1>
        <p class="subtitle">Administrator Portal</p>

        <form id="admin-login-form">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                autocomplete="username"
                placeholder="Enter your admin email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" id="login-button">
                Sign In
            </button>

            <p id="login-message" role="status" aria-live="polite"></p>

        </form>

        <a href="orghub-layout.html" class="back-link">
            ← Return to Public Website
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="admin.js"></script>

</body>
</html>
