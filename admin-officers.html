
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrgHub | Officers Management</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            color: #263445;
        }

        header {
            background: #183153;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .panel {
            background: white;
            padding: 24px;
            border-radius: 10px;
            margin-bottom: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,.05);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd2da;
            border-radius: 5px;
            font: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 85px;
        }

        .full-width { grid-column: 1 / -1; }

        button {
            padding: 10px 15px;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary {
            background: #183153;
            color: white;
        }

        .secondary {
            background: #e7ebf0;
            color: #263445;
        }

        .danger {
            background: #b83232;
            color: white;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #e5e8ed;
            text-align: left;
        }

        th { color: #183153; }

        .status {
            font-size: 13px;
            font-weight: bold;
        }

        .published { color: #16834a; }
        .unpublished { color: #b7791f; }

        #form-message, #list-message {
            font-size: 14px;
            margin-top: 12px;
        }

        @media (max-width: 650px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: auto; }
        }
    </style>
</head>

<body>

<header>
    <h2>OrgHub | Officers</h2>
    <a href="admin-dashboard.html">← Dashboard</a>
</header>

<main>

    <section class="panel">
        <h2 id="form-title">Add New Officer</h2>

        <form id="officer-form">
            <div class="form-grid">

                <div>
                    <label for="full-name">Full Name</label>
                    <input id="full-name" required>
                </div>

                <div>
                    <label for="position">Position</label>
                    <input id="position" required>
                </div>

                <div>
                    <label for="course-year">Course and Year</label>
                    <input id="course-year"
                           placeholder="e.g. BSCpE - 3rd Year">
                </div>

                <div>
                    <label for="sort-order">Display Order</label>
                    <input id="sort-order" type="number" value="0">
                </div>

                <div class="full-width">
                    <label for="bio">Short Biography</label>
                    <textarea id="bio"
                              placeholder="Enter a short officer description"></textarea>
                </div>

                <div class="full-width">
                    <label>
                        <input type="checkbox" id="is-published" checked
                               style="width:auto">
                        Publish this officer on the public website
                    </label>
                </div>

                <div class="full-width actions">
                    <button class="primary" id="save-button" type="submit">
                        Save Officer
                    </button>

                    <button class="secondary" id="cancel-button"
                            type="button" hidden>
                        Cancel Edit
                    </button>
                </div>

            </div>

            <p id="form-message" role="status"></p>
        </form>
    </section>

    <section class="panel">
        <h2>Officer Records</h2>

        <p id="list-message" role="status">Loading officers...</p>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Position</th>
                        <th>Course / Year</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="officers-table"></tbody>
            </table>
        </div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="officers.js"></script>

</body>
</html>
