
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Evaluations | OrgHub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-content { max-width: 1100px; margin: 40px auto; padding: 20px; }
    .admin-panel { background: white; padding: 24px; border-radius: 12px; margin-bottom: 28px; }
    .admin-panel h2 { margin-top: 0; }
    .eval-form { display: grid; gap: 14px; }
    .eval-form label { display: grid; gap: 6px; font-weight: 600; }
    .eval-form input, .eval-form select {
      width: 100%; padding: 11px; border: 1px solid #ccc;
      border-radius: 6px; font: inherit;
    }
    .eval-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .eval-actions button, .table-action {
      padding: 9px 14px; border: 0; border-radius: 6px;
      cursor: pointer; font: inherit;
    }
    .save-btn { background: #173f35; color: white; }
    .cancel-btn { background: #e8e8e8; color: #222; }
    .table-wrap { overflow-x: auto; }
    .eval-table { width: 100%; border-collapse: collapse; }
    .eval-table th, .eval-table td {
      padding: 12px; border-bottom: 1px solid #ddd;
      text-align: left; vertical-align: top;
    }
    .table-action { margin: 2px; }
    .edit-btn { background: #e7edf8; }
    .delete-btn { background: #fbe5e5; }
    .status-published { color: green; font-weight: 600; }
    .status-hidden { color: #a15b00; font-weight: 600; }
    .eval-message { margin: 10px 0; }
  </style>
</head>
<body>

  <main class="admin-content">
    <p><a href="admin-dashboard.html">← Back to Dashboard</a></p>

    <h1>Manage Evaluation Forms</h1>
    <p>Add evaluation forms and connect them to your organization’s events.</p>

    <section class="admin-panel">
      <h2 id="form-title">Add Evaluation Form</h2>

      <form id="evaluation-form" class="eval-form">
        <label>
          Evaluation Title
          <input type="text" id="evaluation-title"
                 placeholder="e.g. Circuit Design Bootcamp Evaluation"
                 required>
        </label>

        <label>
          Related Event
          <select id="evaluation-event">
            <option value="">No linked event</option>
          </select>
        </label>

        <label>
          Google Forms URL
          <input type="url" id="form-url"
                 placeholder="https://docs.google.com/forms/..."
                 required>
        </label>

        <label>
          <span>
            <input type="checkbox" id="evaluation-published">
            Publish this evaluation form
          </span>
        </label>

        <div class="eval-actions">
          <button type="submit" class="save-btn" id="save-button">
            Save Evaluation
          </button>
          <button type="button" class="cancel-btn" id="cancel-button"
                  hidden>
            Cancel
          </button>
        </div>

        <p id="form-message" class="eval-message"></p>
      </form>
    </section>

    <section class="admin-panel">
      <h2>Existing Evaluation Forms</h2>
      <p id="list-message" class="eval-message"></p>

      <div class="table-wrap">
        <table class="eval-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Event</th>
              <th>Publication</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="evaluations-table"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="evaluations.js"></script>
</body>
</html>
