
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Gallery | OrgHub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery-admin { max-width: 1100px; margin: 40px auto; padding: 20px; }
    .gallery-panel { background: white; padding: 24px; border-radius: 12px; margin: 24px 0; }
    .gallery-form { display: grid; gap: 14px; }
    .gallery-form label { display: grid; gap: 6px; font-weight: 600; }
    .gallery-form input, .gallery-form select, .gallery-form textarea {
      width: 100%; padding: 11px; border: 1px solid #ccc;
      border-radius: 6px; font: inherit;
    }
    .gallery-form textarea { min-height: 90px; }
    .gallery-form button, .gallery-action {
      padding: 9px 14px; border: 0; border-radius: 6px; cursor: pointer;
    }
    .gallery-save { background: #173f35; color: white; }
    .gallery-cancel { background: #e8e8e8; }
    .gallery-table-wrap { overflow-x: auto; }
    .gallery-table { width: 100%; border-collapse: collapse; }
    .gallery-table th, .gallery-table td {
      text-align: left; padding: 12px; border-bottom: 1px solid #ddd;
      vertical-align: middle;
    }
    .gallery-thumb { width: 90px; height: 65px; object-fit: cover; border-radius: 6px; }
    .gallery-edit { background: #e7edf8; margin: 2px; }
    .gallery-delete { background: #fbe5e5; margin: 2px; }
    #gallery-preview { max-width: 220px; max-height: 160px; object-fit: cover; }
    .gallery-message { margin: 10px 0; }
  </style>
</head>
<body>
  <main class="gallery-admin">
    <p><a href="admin-dashboard.html">← Back to Dashboard</a></p>
    <h1>Manage Gallery</h1>
    <p>Upload and manage photos displayed in the public OrgHub gallery.</p>

    <section class="gallery-panel">
      <h2 id="gallery-form-title">Add Gallery Image</h2>

      <form id="gallery-form" class="gallery-form">
        <label>
          Image Title
          <input id="gallery-title" type="text" required maxlength="150">
        </label>

        <label>
          Related Event
          <select id="gallery-event">
            <option value="">No linked event</option>
          </select>
        </label>

        <label>
          Caption
          <textarea id="gallery-caption" maxlength="1000"
                    placeholder="Write a short description..."></textarea>
        </label>

        <label>
          Upload Image
          <input id="gallery-image" type="file"
                 accept="image/jpeg,image/png,image/webp">
        </label>

        <img id="gallery-preview" alt="Selected image preview" hidden>

        <label>
          <span>
            <input id="gallery-published" type="checkbox">
            Publish this image
          </span>
        </label>

        <div>
          <button type="submit" class="gallery-save" id="gallery-save">
            Save Image
          </button>
          <button type="button" class="gallery-cancel" id="gallery-cancel" hidden>
            Cancel
          </button>
        </div>

        <p id="gallery-form-message" class="gallery-message"></p>
      </form>
    </section>

    <section class="gallery-panel">
      <h2>Existing Gallery Images</h2>
      <p id="gallery-list-message" class="gallery-message"></p>

      <div class="gallery-table-wrap">
        <table class="gallery-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Title</th>
              <th>Event</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="gallery-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
