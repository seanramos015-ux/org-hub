<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrgHub | Site Settings</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Your existing Supabase configuration -->
    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .header p {
            color: #777;
            margin-top: 0;
        }

        a {
            color: #174c35;
            text-decoration: none;
            font-weight: bold;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,.06);
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font: inherit;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: 2px solid #174c35;
            border-color: transparent;
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .logo-preview {
            height: 64px;
            max-width: 160px;
            object-fit: contain;
            border: 1px solid #ddd;
            border-radius: 7px;
            padding: 4px;
            background: #fff;
        }

        .logo-row small {
            display: block;
            margin-top: 6px;
            color: #777;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        #saveBtn {
            background: #174c35;
            color: white;
        }

        #resetBtn {
            background: #e9ecef;
            color: #333;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        #updated {
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <h1>Site Settings</h1>
            <p>Manage your organization's website information.</p>
        </div>

        <a href="admin-dashboard.html">← Back to Dashboard</a>
    </div>

    <div class="card">

        <form id="settingsForm">

            <div class="field">
                <label for="logoFile">Site Logo</label>
                <div class="logo-row">
                    <img id="logoPreview" class="logo-preview" alt="Logo preview" style="display:none">
                    <div>
                        <input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp,image/svg+xml">
                        <small>PNG, JPG, WebP or SVG, up to 2 MB. Leave empty to keep the current logo.</small>
                    </div>
                </div>
            </div>

            <div class="field">
                <label>Organization Name</label>
                <input id="organization_name" required>
            </div>

            <div class="field">
                <label>Academic Year</label>
                <input id="academic_year" required>
            </div>

            <div class="field">
                <label>Homepage Headline</label>
                <input id="homepage_headline" required>
            </div>

            <div class="field">
                <label>Homepage Description</label>
                <textarea id="homepage_description" required></textarea>
            </div>

            <div class="field">
                <label>Mission</label>
                <textarea id="mission" required></textarea>
            </div>

            <div class="field">
                <label>Vision</label>
                <textarea id="vision" required></textarea>
            </div>

            <div class="buttons">
                <button type="submit" id="saveBtn">Save Changes</button>
                <button type="button" id="resetBtn">Reset Changes</button>
            </div>

            <p id="message"></p>
            <p id="updated">Last updated: Loading...</p>

        </form>
    </div>
</div>

<script>
    const keys = [
        "organization_name",
        "academic_year",
        "homepage_headline",
        "homepage_description",
        "mission",
        "vision"
    ];

    const form = document.getElementById("settingsForm");
    const message = document.getElementById("message");
    const saveBtn = document.getElementById("saveBtn");
    const resetBtn = document.getElementById("resetBtn");
    const updated = document.getElementById("updated");
    const logoFile = document.getElementById("logoFile");
    const logoPreview = document.getElementById("logoPreview");

    let savedValues = {};
    let pendingLogoFile = null;
    let previewObjectUrl = null;

    function showMessage(text, type = "") {
        message.textContent = text;
        message.className = type;
    }

    function setLoading(loading) {
        saveBtn.disabled = loading;
        resetBtn.disabled = loading;
        saveBtn.textContent = loading ? "Please wait..." : "Save Changes";
    }

    // ---------- Logo handling ----------
    function showLogoPreview(src) {
        if (src) {
            logoPreview.src = src;
            logoPreview.style.display = "";
        } else {
            logoPreview.removeAttribute("src");
            logoPreview.style.display = "none";
        }
    }

    function resetLogoUI() {
        pendingLogoFile = null;
        logoFile.value = "";
        if (previewObjectUrl) {
            URL.revokeObjectURL(previewObjectUrl);
            previewObjectUrl = null;
        }
        showLogoPreview(savedValues.logo_url || "");
    }

    logoFile.addEventListener("change", function () {
        const file = logoFile.files[0];
        if (!file) return resetLogoUI();

        const okTypes = ["image/png", "image/jpeg", "image/webp", "image/svg+xml"];
        if (!okTypes.includes(file.type)) {
            showMessage("Logo must be a PNG, JPG, WebP or SVG image.", "error");
            return resetLogoUI();
        }
        if (file.size > 2 * 1024 * 1024) {
            showMessage("Logo must be 2 MB or smaller.", "error");
            return resetLogoUI();
        }

        pendingLogoFile = file;
        if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
        previewObjectUrl = URL.createObjectURL(file);
        showLogoPreview(previewObjectUrl);
        showMessage("");
    });

    async function uploadLogo(file) {
        const ext = file.name.split(".").pop().toLowerCase();
        const path = `logo/logo-${Date.now()}.${ext}`;

        const { error } = await supabaseClient.storage
            .from("site-assets")
            .upload(path, file, { upsert: true });

        if (error) throw error;

        return supabaseClient.storage
            .from("site-assets")
            .getPublicUrl(path).data.publicUrl;
    }

    // ---------- Verify logged-in administrator ----------
    async function checkAdmin() {
        const { data, error } = await supabaseClient.auth.getSession();

        if (error || !data.session) {
            window.location.href = "admin-login.html";
            return false;
        }

        const { data: isAdmin, error: adminError } =
            await supabaseClient.rpc("is_org_admin");

        if (adminError || !isAdmin) {
            await supabaseClient.auth.signOut();
            alert("Unauthorized access.");
            window.location.href = "admin-login.html";
            return false;
        }

        return true;
    }

    // ---------- Load settings ----------
    async function loadSettings() {
        showMessage("Loading settings...");

        const { data, error } = await supabaseClient
            .from("site_settings")
            .select("setting_key, setting_value, updated_at");

        if (error) {
            showMessage("Unable to load settings: " + error.message, "error");
            return;
        }

        savedValues = {};

        data.forEach(item => {
            savedValues[item.setting_key] = item.setting_value;

            const field = document.getElementById(item.setting_key);

            if (field && keys.includes(item.setting_key)) {
                field.value = typeof item.setting_value === "string"
                    ? item.setting_value
                    : "";
            }
        });

        keys.forEach(key => {
            const field = document.getElementById(key);

            if (!Object.prototype.hasOwnProperty.call(savedValues, key)) {
                field.value = "";
            }
        });

        // Restore the saved logo and clear any unsaved selection.
        resetLogoUI();

        const dates = data
            .map(item => item.updated_at)
            .filter(Boolean)
            .sort((a, b) => new Date(b) - new Date(a));

        updated.textContent = dates.length
            ? "Last updated: " + new Date(dates[0]).toLocaleString()
            : "Last updated: Not available";

        showMessage("Settings loaded successfully.", "success");
    }

    // ---------- Save settings ----------
    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        if (!form.reportValidity()) return;

        if (!confirm("Save all site settings?")) return;

        setLoading(true);
        showMessage("Saving settings...");

        const updates = keys.map(key => ({
            setting_key: key,
            setting_value: document.getElementById(key).value
        }));

        try {
            if (pendingLogoFile) {
                const logoUrl = await uploadLogo(pendingLogoFile);
                updates.push({ setting_key: "logo_url", setting_value: logoUrl });
            }
        } catch (uploadError) {
            showMessage("Logo upload failed: " + uploadError.message, "error");
            setLoading(false);
            return;
        }

        const { error } = await supabaseClient
            .from("site_settings")
            .upsert(updates, {
                onConflict: "setting_key"
            });

        if (error) {
            showMessage("Save failed: " + error.message, "error");
        } else {
            await loadSettings();
            showMessage("Settings saved successfully!", "success");
        }

        setLoading(false);
    });

    // ---------- Reset to last saved values ----------
    resetBtn.addEventListener("click", async function () {
        if (!confirm("Discard unsaved changes?")) return;

        setLoading(true);
        await loadSettings();
        setLoading(false);
    });

    // ---------- Initialize ----------
    async function initialize() {
        try {
            if (typeof supabaseClient === "undefined") {
                showMessage(
                    "Supabase client not found. Check supabase-config.js.",
                    "error"
                );
                return;
            }

            const authorized = await checkAdmin();

            if (authorized) {
                await loadSettings();
            }

        } catch (error) {
            console.error(error);
            showMessage("Error: " + error.message, "error");
        }
    }

    initialize();
</script>

</body>
</html>
